[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpgboard-env"
version = "0.1.0"
description = "numpy-only Python client for the Dragon Rush training environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["rpgboard_env"]
